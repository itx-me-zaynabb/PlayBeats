<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spotify-Your favourite music is here</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <nav class="header">
      <div class="logo">
        <img src="photos/Playbeats-logo.png" alt="Playbeats Logo" />
        <h1>Playbeats</h1>
      </div>

      <ul class="nav-links">
        <li><a href="#">Home</a></li>
        <li><a href="#">Albums</a></li>
      </ul>
    </nav>

    <div class="container">
      <div class="songlist">
        <h1>Best of NCS-No Copyright Sounds</h1>
        <div class="songItemContainer">
          <div class="songItem">
            <img src="photos/1.jpg" alt="10" />
            <span class="songName">Let me Love You</span>
            <span class="songlistplay">
              <span class="timestamp">
                05:34
                <i id="0" class="fas songItemPlay fa-play"></i>
              </span>
            </span>
          </div>
          <div class="songItem">
            <img src="photos/2.jpg" alt="2" />
            <span class="songName">Salam-e-ishq</span>
            <span class="songlistplay">
              <span class="timestamp">
                04:40
                <i id="1" class="fas songItemPlay fa-play"></i>
              </span>
            </span>
          </div>
          <div class="songItem">
            <img src="photos/3.jpg" alt="3" />
            <span class="songName">No Love</span>
            <span class="songlistplay">
              <span class="timestamp">
                03:34
                <i id="2" class="fas songItemPlay fa-play"></i>
              </span>
            </span>
          </div>
          <div class="songItem">
            <img src="photos/4.jpg" alt="4" />
            <span class="songName">Old Money</span>
            <span class="songlistplay">
              <span class="timestamp">
                07:00
                <i id="3" class="fas songItemPlay fa-play"></i>
              </span>
            </span>
          </div>
          <div class="songItem">
            <img src="photos/5.jpg" alt="5" />
            <span class="songName">STFU</span>
            <span class="songlistplay">
              <span class="timestamp">
                05:20
                <i id="4" class="fas songItemPlay fa-play"></i>
              </span>
            </span>
          </div>
          <div class="songItem">
            <img src="photos/6.jpg" alt="6" />
            <span class="songName">IDK How</span>
            <span class="songlistplay">
              <span class="timestamp">
                03:34
                <i id="5" class="fas songItemPlay fa-play"></i>
              </span>
            </span>
          </div>
          <div class="songItem">
            <img src="photos/7.jpg" alt="7" />
            <span class="songName">Cheques</span>
            <span class="songlistplay">
              <span class="timestamp">
                2:00
                <i id="6" class="fas songItemPlay fa-play"></i>
              </span>
            </span>
          </div>
          <div class="songItem">
            <img src="photos/8.jpg" alt="8" />
            <span class="songName">Dil Nu</span>
            <span class="songlistplay">
              <span class="timestamp">
                01:10
                <i id="7" class="fas songItemPlay fa-play"></i>
              </span>
            </span>
          </div>
          <div class="songItem">
            <img src="photos/9.jpg" alt="9" />
            <span class="songName">Khayal</span>
            <span class="songlistplay">
              <span class="timestamp">
                02:54
                <i id="8" class="fas songItemPlay fa-play"></i>
              </span>
            </span>
          </div>
          <div class="songItem">
            <img src="photos/1.jpg" alt="1" />
            <span class="songName">Afsos</span>
            <span class="songlistplay">
              <span class="timestamp">
                01:54
                <i id="9" class="fas songItemPlay fa-play"></i>
              </span>
            </span>
          </div>
        </div>
      </div>
      <div class="songbanner"></div>
    </div>
    <div class="bottom">
      <input
        type="range"
        name="range"
        id="myProgressBar"
        min="0"
        value="0"
        max="100"
      />
      <div class="icons">
        <i class="fas fa-2x fa-backward" id="previous"></i>
        <i class="fas fa-2x fa-play" id="masterPlay"></i>
        <i class="fas fa-2x fa-forward" id="next"></i>
      </div>
      <div class="songInfo" id="masterSongInfo">
        <img src="photos/playing.gif" width="42px" alt="" id="gif" />
        <span id="masterSongName">Let me Love You - Justin Bieber</span>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
